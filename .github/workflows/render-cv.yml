name: Render a CV
# Disabled 2026-08-27: the automatic push trigger is removed.
#
# This workflow runs the strict `rendercv` CLI against _data/cv.yml to generate a
# template PDF. Our cv.yml uses the field names shipped in the al-folio demo
# (studyType, awarder, releaseDate, level), which RenderCV's schema rejects, so it
# failed on its first ever run. The generated PDF is redundant — the CV download
# button points at assets/pdf/drummond_pdf.pdf, Priscila's own formatted CV — and
# this workflow is independent of deploy.yml, so disabling it does not affect the site.
#
# To re-enable: restore the `push:` block below and convert cv.yml to the strict
# RenderCV schema first, or the failure returns.
on:
  # push:
  #   branches:
  #     - main
  #     - master
  #   paths:
  #     - "_data/cv.yml"
  #     - "assets/rendercv/design.yaml"
  #     - "assets/rendercv/locale.yaml"
  #     - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          rendercv render $cv_file --settings $settings
          rm assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
