    Research Interests:
      - label: Research
        details: "Resource allocation in constrained service and supply systems · Prescriptive analytics for multi-agency coordination · Supply chain compliance and labor risk · Responsible analytics and the distributional consequences of optimized decisions · Analytics and operations pedagogy"
      - label: Methods
        details: "Network optimization and interdiction · Integer and mixed-integer programming · Bayesian decision analysis · Multilevel and hierarchical regression · Data envelopment analysis · Expert elicitation · Scoping and systematic review · Qualitative and participatory methods"

    Publications:
      - title: "Enhancing detection of labor violations in the agricultural sector: A multilevel generalized linear regression model of H-2A violation counts"
        authors:
          - Ali Jafari
          - Sabrina Bhimani
          - Priscila A. Drummond
          - Dan Nishigaya
          - Aidong A. Ding
          - Amy Farrell
          - Kayse Lee Maass
        publisher: "PLOS ONE, 19(5), e0302960 — refereed journal article"
        releaseDate: 2024-05-01
        url: https://doi.org/10.1371/journal.pone.0302960
        summary: >-
          A multilevel regression model of H-2A visa and labor violations, built to help the
          U.S. Department of Labor target limited investigative capacity toward the producers
          most associated with violations, including those that can indicate labor trafficking.

      - title: "Collaboration in anti-trafficking efforts: A network interdiction problem with multiple dependent attacks"
        authors:
          - Priscila A. Drummond
          - Kayse Lee Maass
        publisher: "Job market paper — working paper, submission September 2026"
        releaseDate: 2026-09-01
        summary: >-
          What happens to a coordinated enforcement decision when several agencies act on the
          same part of a network and their actions do not combine independently. Defines the
          class of functions satisfying four axioms rather than assuming one algebraic form,
          and gives an exact linearization with dual bounds. Two results are aimed at a
          management audience: the cost of assuming independence, and the coordination gap
          between a centralized task force and the same agencies spending separately.

      - title: "Multiple non-independent interventions on the same network element: A scoping review"
        authors:
          - Priscila A. Drummond
          - Kayse Lee Maass
        publisher: "Under review at Networks"
        releaseDate: 2026-08-01
        summary: >-
          A PRISMA-ScR review registered on OSF, across four databases with two independent
          reviewers screening and extracting. Establishes that independence, or the absence of
          same-element multiplicity altogether, is the norm in the literature.

      - title: "Network interdiction to improve labor trafficking detection in the U.S. agricultural sector"
        authors:
          - Ali Jafari
          - Sabrina Bhimani
          - Priscila A. Drummond
          - Amy Farrell
          - Kayse Lee Maass
        publisher: "Revise and resubmit at Decision Sciences"
        releaseDate: 2026-01-01
        summary: >-
          Applies network interdiction to collaborative detection across the Department of
          Labor and the Department of Homeland Security.

      - title: "Structural results and complexity for network interdiction with dependent multiple interventions"
        authors:
          - Priscila A. Drummond
          - Kayse Lee Maass
        publisher: "Working paper"
        releaseDate: 2026-01-01
        summary: >-
          Under a logarithmic transform the problem is shortest-path interdiction and therefore
          NP-hard. The claim is narrower and more useful: structure discovery is polynomial and
          independent of the choice of function, and the optimal intervention can be restricted
          to a candidate set determined by which parts of the network are in play.

      - title: "Algorithms for network interdiction problems with nonlinear attacks"
        authors:
          - Priscila A. Drummond
          - Kayse Lee Maass
        publisher: "Working paper"
        releaseDate: 2026-01-01
        summary: >-
          A three-phase procedure — structure recovery, depth determination, and budget
          allocation with re-optimization after each commitment — verified against exhaustive
          enumeration on instances small enough to permit it, and reported by structural case.

      - title: "Active learning experiences: A teaching fellowship in industrial engineering education"
        authors:
          - Priscila A. Drummond
        publisher: "Working paper, in preparation"
        releaseDate: 2026-01-01
        summary: >-
          Narrative and autoethnographic analysis of how mentored teaching shapes an
          instructor's confidence and identity.

      - title: "U.S. ports of entry's decision model with an anti-human trafficking focus"
        authors:
          - Priscila A. Drummond
          - Hiram Moya
        publisher: "Decision Sciences Institute Proceedings — refereed conference proceedings"
        releaseDate: 2020-11-01
        summary: >-
          A Bayesian decision model with cost-benefit analysis for when officers at U.S. ports
          of entry should escalate a screening for possible human trafficking.

